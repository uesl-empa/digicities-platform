[pytest]
testpaths = tests
addopts = -ra -m "not live"
markers =
    unit: pure in-process test, no services needed
    api: exercises apps/api over fastapi.testclient (needs the apps/api extra)
    smoke: cross-backend SPARQL parity smoke
    live: needs running services (Fuseki/GraphDB/NextCloud) — deselected by default
