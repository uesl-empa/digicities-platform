name: ci

# The full test suite — unit, characterization goldens, REST-API contract,
# and architecture guards — on every PR and push to main. The cross-backend
# SPARQL parity smoke keeps its own path-filtered workflow
# (cross-backend-smoke.yml); it also runs here as part of the suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install platform + API deps
        run: |
          pip install -r requirements.txt -r apps/api/requirements.txt
          pip install pytest httpx
      - name: Run test suite
        run: pytest -v
