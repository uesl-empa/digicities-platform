# ============================================================================
# LOCAL DEVELOPMENT ONLY — anonymous access to the Fuseki triplestore.
#
# The bundled stain/jena-fuseki image ships a shiro.ini that puts the admin
# endpoints (/$/server, /$/datasets, ...) behind Basic auth. Its old web UI
# then hangs on "Loading..." because its background fetches to those endpoints
# get 401 and it never prompts for a login. Making everything anonymous lets the
# UI (and any SPARQL client) work with no login.
#
# This is applied via docker-compose.override.yml, which is the DEV overlay and
# is NOT part of the production `docker-compose.yml`. Fuseki is only published on
# 127.0.0.1:3030. Do NOT reuse this file on any instance reachable beyond your
# own machine — it disables all authentication, including data writes.
# ============================================================================

[main]
ssl.enabled = false

[users]

[roles]

[urls]
# Everything open — read, admin API, updates, and data endpoints.
/**=anon
